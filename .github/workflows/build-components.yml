name: Build components

# Every pull request produces a downloadable, importable .cpt for each component
# that carries a component.json, so a reviewer can import the thing the PR
# actually describes instead of pasting a script body into Datto by hand.
#
# Nothing here commits to the repository. On a pull request the .cpt files are
# workflow artifacts; on main they are also published to the rolling `latest`
# release, which gives them a permanent URL instead of a 30-day expiry.
#
# Neither path ever publishes an export carrying an attachment. An Applications
# export bundles the vendor's installer, and this repo is public. See
# CONTRIBUTING.md.

on:
  pull_request:
    paths:
      - 'Applications/**'
      - 'Scripts/**'
      - 'Monitors/**'
      - 'tools/**'
      - '.github/workflows/build-components.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Enforces the two review-checklist items in CONTRIBUTING.md that a human
      # is otherwise expected to catch: a committed .cpt must carry no
      # attachment, and must match the script committed beside it.
      - name: Audit committed .cpt files
        run: python3 tools/cpt.py audit

      # Proves the packer still reproduces a real Datto export byte for byte,
      # whenever a reference export is available to check against. samples/ is
      # gitignored, so this is normally a no-op and never fails the build.
      - name: Verify packer against reference exports
        run: |
          shopt -s nullglob
          references=(samples/*/*.cpt)
          if [ ${#references[@]} -eq 0 ]; then
            echo "No reference exports in samples/ - skipping."
            exit 0
          fi
          python3 tools/cpt.py verify "${references[@]}"

      - name: Build every component with a manifest
        id: build
        run: |
          python3 tools/cpt.py pack-all --out-dir dist | tee build.log
          echo "count=$(find dist -name '*.cpt' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Datto RMM component exports"
            echo
            if [ -s build.log ]; then
              echo '```'
              cat build.log
              echo '```'
            fi
            echo
            echo "Download the **component-exports** artifact below, then import each"
            echo "\`.cpt\` in Datto RMM via **Components → New Component → Import Component**."
            echo
            echo "> A component folder is only built once it has a \`component.json\`."
            echo "> To add one to an existing component, export it from Datto and run"
            echo "> \`python3 tools/cpt.py unpack \"export.cpt\" -o <folder>\` — that keeps the"
            echo "> component's existing \`uid\`, so importing updates it rather than"
            echo "> creating a duplicate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exports
        if: steps.build.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: component-exports
          path: dist/*.cpt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish to the latest release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job writes. The build job above stays read-only.
    permissions:
      contents: write
    # A second merge landing mid-publish would race the tag move.
    concurrency:
      group: publish-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Rebuilt rather than carried over from the build job, so this job needs
      # no artifact plumbing. Builds are deterministic, so it is the same bytes.
      - name: Build
        run: python3 tools/cpt.py pack-all --out-dir dist

      # Drops any export that must not be published, and writes the notes.
      - name: Stage
        id: stage
        run: |
          python3 tools/cpt.py stage-release --dir dist
          echo "count=$(find dist -name '*.cpt' | wc -l)" >> "$GITHUB_OUTPUT"

      # `latest` is a moving pointer at the current main, so the release and its
      # tag are replaced rather than edited - gh cannot retarget a tag in place.
      #
      # Assets are uploaded separately, and the glob is passed QUOTED so that gh
      # expands it rather than bash. gh globs each asset argument it is given,
      # so a component whose name contains brackets - "... [LIN].cpt" - is read
      # as a character class and matches nothing. Handing gh a bracket-free
      # pattern and letting it do the expansion avoids the problem entirely.
      - name: Publish
        if: steps.stage.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Component exports" \
            --notes-file dist/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
          gh release upload latest 'dist/*.cpt' --clobber
          {
            echo "Published ${{ steps.stage.outputs.count }} export(s)."
            gh release view latest --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to publish
        if: steps.stage.outputs.count == '0'
        run: echo "No publishable exports; release left unchanged." >> "$GITHUB_STEP_SUMMARY"
